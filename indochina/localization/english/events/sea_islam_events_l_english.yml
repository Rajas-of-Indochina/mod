l_english:
 alevi.0003.t:0 "Rise of Alevism"
 alevi.0003.desc:0 ""Mehemmed was the Yalavaç of Tengri.", the man says, "Tengri chose him to guide mankind to love and truth."\n\nThese are the words of a popular sage among the Turks, spreading from ear to ear like wildfire.\n\nAs Turkic hordes conquered and settled in new lands, they brought Islam with them. But even after Islamisation, those migratory tribes did not simply abandon their old way of life, but merged it with a new set of beliefs, one sage among them stands out - [new_alevi.GetName], also known as "Haji Bektash Veli".\n\nThis charismatic wandering mystic has systemised these beliefs and already garnered many followers over the years, word has it that many previously non-Muslim Turks are converting to Islam in flocks. He himself claims to preach nothing new, and states again and again that he is drawing his teachings from past Muslim scholars like [ahmad_yasawi_roa.GetName], [aslanbab.GetName], and [persian_scholars_3.GetName] though some among his opponents claim his words sometimes contradict orthodox Islam.\n\nWhat does all of this mean for the region?"
 alevi.0003.a:0 "Interesting..."
 alevi.0003.b:0 "He has some good points, actually!"

 alevi.0004.t:0 "Investigate Islam"
 alevi.0004.desc:0 "A servant walks up to me, informing me that the Muslim envoy we called for has finally arrived. I order him to be brought before me. The man arrives, looking around, and then at me. Dressed in fancy foreign robes, he carries an air of purpose, carrying himself with the authority of one who serves a mighty ruler and a powerful faith. I signal him to speak, and he eagerly begins. \n\n"My lord" he says, "My name is [muslim_bolghar_envoy.GetName] and I bring you gifts and greetings and an invitation to understand our ways."\n\nHe hands the servants some papers, and they bring it to me.\n\n"I have brought with me parts of the Qur'an, our holy texts, translated into a dialect which I thought might be more familiar to you.\n\n"If you wish, I can share more about the faith, so you may judge for yourself whether it has a place in your realm.""
 alevi.0004.a:0 "Tell me about this Islam of yours."

 BASMALA_BOLGHAR_GLOSS: "The #bold "Basmala"#! is the phrase "Bismillah ar-Rahman ar-Rahim," meaning "In the name of Allah, the Most Compassionate, the Most Merciful." It opens almost every chapter of the Qur'an and is a reminder to begin actions with mindfulness of God’s mercy and guidance. Muslims recite it before any task."

 alevi.0005.t:0 "Investigate Islam:"
 alevi.0005.desc:0 "[muslim_bolghar_envoy.GetName] tells me about Islam - Allah, the one and only God, and a prophet they call Muhammad. He sings a calming melody in a foreign language, and tells me it's their holy book. He talks about prayer, washing, the afterlife, their ideas about justice, something about pork and a bunch of theology. What he is saying is good, but it's a big risk to switch religions...\n\n"And that's how it is, my lord.""
 alevi.0005.a:0 "I'm not fully convinced, it's a big risk to switch religions..."

 alevi.0006.t:0 "Investigate Islam"
 alevi.0006.desc:0 ""But there is infinite wisdom in this, our faith gives us rules to live by - laws that strive to protect the weak and honor the strong."\n\nHe observes the skeptical faces in the court before continuing.\n\n"Not to mention, those who accept Islam find unity under God and follow the guidance of our Prophet. For leaders, this unity means people who would fight with renewed purpose. With Islam, tribes and families across lands distant and near have united as brothers. These men fight as one, serve as one, and respect the authority of their rulers under the banner of faith."\n\nHe pauses, then adds, "By embracing Islam, you could gather warriors who are not only loyal but also deeply committed. And you'd be part of the [Glossary( 'Ummah', 'UMMAH_BOLGHAR_GLOSS' )] - becoming like siblings with all Muslim rulers. Not to mention all the trade benefits...""
 alevi.0006.a:0 "Now you're talking! Praying to Allah sounds great!"
 alevi.0006.b:0 "Not interested, but thank you for your visit."

 UMMAH_BOLGHAR_GLOSS: "The #bold "Ummah"#! is the global community of Muslims bound together by faith, transcending ethnic, national, and cultural divisions. As per the Qur'an, Muslims are a single nation, the Ummah."

 alevi.0007.t:0 "Investigate Islam"
 alevi.0007.desc:0 ""To join Islam, you need only to recite a simple sentence. These words mark your entry into our faith, and they will bind you to this new path."\n\nHe recites [Glossary( 'an Arabic phrase', 'SHAHADA_BOLGHAR_GLOSS' )], which I repeat. I am then given a rough translation.\n\nWith the declaration made, the envoy presents me with a simple, dignified robe.\n\"You are now part of a greater faith, a bond shared across many lands. May it strengthen your rule and bring prosperity to your people.""
 alevi.0007.a:0 "Hey, why don't you stay and keep guiding us?"

 SHAHADA_BOLGHAR_GLOSS: "The #bold "Shahada"#! is the Islamic declaration of faith, stating, "There is no god but Allah, and Muhammad is the Messenger of Allah." It is the first pillar of Islam and expresses the core belief in the oneness of God and the prophethood of Muhammad. Reciting the shahada with sincere conviction is essential to becoming a Muslim."

 alevi.0009.desc:0 "There are words of a faith spreading across many lands, which they call "Islam", drawing people from many walks of life, even some of our fellow Turks. Their influence is growing, shaping politics, strengthening armies, and advancing knowledge in arts and sciences. Perhaps, by embracing this faith, we too could share in its power. By inviting an envoy from a mighty Muslim ruler, we may learn how to join them and welcome Islam into our realm. And who knows, maybe they have some good points after all? Now that we are independent, this could be of use to us."
 alevi.0009.a:0 "Contact Muslim rulers"

 alevi.0010.t:0 "The Rise of Constantinople"
 alevi.0010.desc:0 "The city of Constantinople has fallen, its mighty walls breached, and its streets now echo with the sound of triumph. Smoke rises from the great city as my forces march through, and the people, stunned and fearful, look upon their new ruler. The words of the Prophet Muhammad ring in my mind, I am the one chosen to fulfill the prophecy, to bring this city into the fold of Islam. The title of Fatih -the Conqueror- is now mine. As my men explore the city, news arrives that the grave of [Glossary('Abu Ayyub al-Ansari', 'ANSARI_GLOSS')], a companion of the Prophet who died during an earlier attempt to take this city, has been discovered by a prominent Sufi master and his students, the site has already become a place of reverence for my soldiers. As I explore further, before me stands the magnificent Hagia Sophia, its great dome gleaming in the sunlight. Once a symbol of their faith, it could now serve as a grand mosque, a center of worship for generations to come. Volunteers from all over the Muslim world will be flocking to fight under me."
 alevi.0010.a:0 "Now, what was that other one, "Rome"?."

 alevi.0011.t:0 "Constantinople"
 alevi.0011.desc:0 "I was attending to important matters when one of my courtiers hurried in, his face alight with urgency. Bowing deeply, he delivered the news: Constantinople, the great city, has fallen to the Muslim forces of [scoped_fatih.GetName]. The prophecy spoken by the Prophet Muhammad has been fulfilled.\n\nFor a moment, I sat in silence, taking in the weight of the news. The fall of such a mighty city is no small thing. Whispers of celebration began to ripple through the room, though my thoughts turned to the implications. What will this mean for the balance of power? And yet, I cannot help but feel a faint sense of triumph. This is a victory for Islam, and history will remember it as such."
 alevi.0011.a:0 "History in the making."

 alevi.0012.t:0 "The fall of Constantinople"
 alevi.0012.desc:0 "I was seated in company of my advisors, discussing the affairs of the realm, when a messenger burst into the chamber, his face pale. ‘My lord,’ he began, struggling to speak, ‘Constantinople... the infidels have taken it.’\n\nA somber silence filled the room as we absorbed the enormity of what had occurred. The city, a cornerstone of trade and diplomacy, once a beacon of Eastern Christendom, had stood as a vital bulwark against the rising power of the Muslim world. Its fall is not just a loss for faith but a shift in the balance of power in the region. The implications are troubling. With the city’s wealth and strategic position now in enemy hands, they will surely use this victory to expand their influence further."
 alevi.0012.a:0 "God forgive our sins."

 alevi.0013.t:0 "Constantinople"
 alevi.0013.desc:0 "News has reached me: Constantinople, the legendary city of trade and power, has fallen to my liege’s forces. The message spread quickly across the realm. Merchants are already speculating about the new opportunities this conquest might bring, while priests speak in hushed tones about the fate of the city’s people. Among the lords, there is quiet discussion of how this might alter the balance of power in the region. I cannot deny the significance of this moment. The fall of Constantinople has strengthened my liege’s position, but it also raises questions about what this means for our future. For now, I must focus on maintaining my own place in this shifting political landscape."
 alevi.0013.a:0 "Interesting news indeed."

 alevi.0014.t:0 "Constantinople"
 alevi.0014.desc:0 "The city of Constantinople has fallen, its mighty walls breached, and its streets now echo with the sound of triumph. Smoke rises from the great city as my liege's forces march through, and the people, stunned and fearful, look upon their new ruler. The words of the Prophet Muhammad ring in my mind, my liege was the chosen one to bring this city into the fold of Islam. As my liege's men explore the city, news arrives that the grave of [Glossary('Abu Ayyub al-Ansari', 'ANSARI_GLOSS')], a companion of the Prophet who died during an earlier attempt to take this city, has been discovered. What will this mean for the balance of power? And yet, I cannot help but feel a faint sense of triumph. This is a victory for Islam, and history will remember it as such."
 alevi.0014.a:0 "History in the making."

