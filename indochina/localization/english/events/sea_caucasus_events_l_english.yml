l_english:
 caucasianroa.001.t:0 "The quest for God"
 caucasianroa.001_desc:0 "We have sent some of our best men to distant Christian lands in order to bring us up to speed with the current state of the Christian world, and they brought with them some merchants and theologians who volunteered to help us with the process of Christianization. We're already acquainted with the Churches in Rome and Constantinople. Additionally, there are others telling us about other churches."
 caucasianroa.001.a:0 "The swords of Western Christendom can defend us."
 caucasianroa.001.b:0 "Constantinople was the one to Christianize us in the first place."
 caucasianroa.001.c:0 "We could increase our bonds with Armenian trade partners!"
 caucasianroa.001.d:0 "Patriarchate of the East? Does that include us?"
 caucasianroa.001.e:0 "On second thought, we are already good Christians."

 caucasianroa.002.t:0 "Armenian Merchants: Success!"
 caucasianroa.002_desc:0 "It has been a while since I approved of a plan to seek further cooperation with Armenians. In the afternoon, my steward approached me and informed me of the success of my plan regarding Armenian trade. It seems my efforts haven't gone unnoticed; numerous merchants and artisans, whether driven by profit or adventure, are flocking to my lands, which is already making me a profit. Additionally, the Armenian leader has reached out to me, expressing optimism for our future cooperation."
 caucasianroa.002.a:0 "Splendid."

 caucasianroa.005.t:0 "The Prince of Princes"
 caucasianroa.005_desc:0 "This is the greatest moment in history since the age of the [Glossary( 'Narts', 'NARTS_GLOSS' )]! Every important person in Circassia is here - nobles, warriors, clergy, great $trait_thamade$s from all over the country, and even some old foes are arriving to hold the greatest $d_circassian_pagan$ council in our history where they will pledge their loyalty to me. This will be more than a regular $d_circassian_pagan$ where we talk about petty tribal conflicts or agricultural issues! Today, I will be crowned as the the Prince of Princes. Circassians will now be recognized in the world stage not as quarreling tribes, but as a single people under a single king. No longer will Circassians butcher each other pointlessly, or die for foreign armies - long live Circassia!"
 caucasianroa.005.a:0 "[ROOT.Char.GetFaith.HighGodName] is great."

 caucasianroa.006.t:0 "$udi$ are $udi_later_date$"
 caucasianroa.006.desc:0 "The erstwhile $udi_collective_noun$ were once known to the Parthians as the Ardhan, and were known to the Greeks as Albanians and to the Arabs as ar-Ran. But today, they are known by the name of their language: $udi_later_date$"
 caucasianroa.006.whatever:0 "I see..."
 udi_name_change_tt:0 "The $udi$ culture is now known as $udi_later_date$!"

 caucasianroa.0061.t:0 "$alan$ are $alan_later_date$"
 caucasianroa.0061.desc:0 "The Alans, once known in the world as legendary conquerors, are ceasing to exist. Their descendants, known as Ossetians, will continue their legacy."
 caucasianroa.0061.whatever:0 "I see..."
 alan_name_change_tt:0 "The $alan$ culture is now known as $alan_later_date$!"

 caucasianroa.007.t:0 "The Rise of $k_circassia$"
 caucasianroa.007.desc:0 "Majority of the varied and disperate tribes of Circassia have been gathered together into the The Grand Principality of $k_circassia$, under the leadership of [scoped_unifier.GetName], uniting them as a single people. They call their unifier-king the Āǩəbəug, that is, "Ak Yabgu", a title the Circassians borrowed from Turkic languages, meaning "The White Ruler". This term might be chosen as a direct challenge to the rule of the Turkic tribes in the north. After centuries of never ending infighting, these people have gotten way too used to war, let's hope they will not be directing their military prowess against the outside world..."
 caucasianroa.007.ok:0 "There is now a new power on the Black Sea."

 caucasianroa.008.t:0 "Lost sons of Bahram: The Search"
 caucasianroa.008.desc:0 "In order to prove our Sassanid lineage, we need to make sure that we are relying on the correct sources, and not charlatans. After all, who would like to falsify history for their own benefit? That is why during the last month every great storyteller in our realm has been summoned and interviewed, but none proved to be good enough. After what seemed like another year of interviews, my chancellor suggested that it might be a good idea to find an Iranian scribe instead. After all, the Sassanids, my true ancestors, were Iranian!"
 caucasianroa.008.ok:0 "Just send a messenger to Iran!"

 caucasianroa.009.t:0 "Lost sons of Bahram: The Scribe"
 caucasianroa.009.desc:0 "Our messengers finally return from Iran, bringing with them a man called [persian_expert_sassanid.GetName] who claims to be a "keeper of old secrets", who has memorised some "ancient lost history" that "you can't find in books".\n\n"My lord, I belong to a secret society of wise men who preserve ancient oral traditions..."\n\nHe goes on about their supposed operations as part of this society. It doesn't seem like even he believes his own words.\n\n"Anyway, I think I faintly remember in our ancient wisdom something along the lines of a descendant of Sassan going to Mount Qaf, that is, Elbrus and the Caucasus... But I really need to refresh my memory on that."\n\nHe finishes, taking a breath. "If only there was a way to do that...""
 caucasianroa.009.ok:0 "Give him a bag of gold!"

 caucasianroa.010.t:0 "Lost sons of Bahram: The Scribe"
 caucasianroa.010.desc:0 "I gesture at one of the servants to give him a bag of gold so he could "refresh his memory".\n\n"Oh, that's right! A lost son of the Sassanid lineage, called Abu Khosrow, or Abukhosro. This was the same Abukhosro who fought the Islamic caliphate during the rise of Islam. Yes, yes, this was one of the first secret histories I memorised in fact, totally..."\n\nHe looks around and at the ceiling before continuing.\n\n"I'm sure I have some records of this somewhere, I would reach for it, if only my back would stop hurting...""
 caucasianroa.010.ok:0 "Give the man his gold!"

 caucasianroa.011.t:0 "Lost sons of Bahram: The Scribe"
 caucasianroa.011.desc:0 "I gesture the servant again, to give him more gold.\n\n"Oh yes, here are the papers, my lord. Crazy how unpredictable back pains can be these days!"\n\nI take the papers given to me by [persian_expert_sassanid.GetName]. What I'm looking at is a well fabri-, uh, well prepared family tree, written fully in Persian, detailing my lineage and how it reaches all the way back to the Sassanid Emperors. My reading of Persian is a bit rusty, but I can make out my name, with my usual titles, but also with the additional title "Great Shah of Mount Qaf". Next to it is a poem:\n\n"In shadows deep, a secret son,\n\nOf Farrukhan, from Sassan's line,\n\nWith gold in hand, set out as one,\n\nTo rule a land where stars still shine.\n\nBeyond the mountains, mists, and storms,\n\nTo earth's far edge, he rode with pride,\n\nTo claim a throne in foreign forms,\n\nWhere ancient legends still abide."\n\nHe clears his throat.\n\n"We can spread this all around the region around Mount Qaf and even in Iran, if we so wish. I know a great deal of influential people, my lord. I'm sure I could contact them to spread the word," he says, before pausing for a second, "if only my hand didn't hurt, so I could write some letters...""
 caucasianroa.011.ok:0 "Gold!"

 caucasianroa.012.t:0 "Lost sons of Bahram: The Scribe"
 caucasianroa.012.desc:0 ""Gol-"\n\nBefore I even finish my sentence, the servant gets the sign and gives him another bag of gold.\n\n"Good thing I can write with my other hand! Consider this matter done, my lord. I will send word to my associates around Iran, as well as some merchantile friends of mine who operate in this region. Now if I was greedy and did my work for the sake of worldly gains, I would shamelessly ask you for compenstation for my work. But know that I do it solely out of passion for history, so consider my services to be a gift..."\n\nWith that, he leaves, biting his gold coins and taking the papers with him."
 caucasianroa.012.ok:0 "What an honest man!"

 caucasianroa.013.t:0 "Lost sons of Bahram: The Results"
 caucasianroa.013.desc:0 "We did it.\n\nIt started with some rumours on the streets planted by [persian_expert_sassanid.GetName]'s agents. Then it spread in our lands like wildfire. Everyone in our country started talking about the deeds of my ancestors.\n\nIt was not long before I received word from Iran that my claims have also been presented there. Unlike here in our homeland, those in Iran were much more skeptical of it, with some outright mocking our claims or getting furious. Others did not even take it seriously. There were some who believed us, but certainly, they were a minority. But alas! Everyone knows I'm a great Iranian! Who cares what those Iranians think? My people are convinced!\n\nAlthough if I embraced their faith, maybe the Iranians would look more positively on my claims?\n\nOn one hand is Islam, which is rising in Persia, as well as right here in the Caucasus. Besides helping with my claims it night help me forge allianes with my neighbours.\n\nOn the other hand is Zoroastrianism, the original religion of the Sassanid Emperors. We can find some holy texts and invite surviving Zoroastrian clergy to teach us the religion so we can truly become one with our ancestors."
 caucasianroa.013.ok:0 "Nonsense! I am a Sassanid, religion is irrelevant."
 caucasianroa.013.islam:0 "Islam is the dominant religion in Persia right now."
 caucasianroa.013.zoroastrianism:0 "Zoroastrianism was the original religion of the Iranians."

 sassanid_claimant_avar:0 "Sassanid Claimants"
 sassanid_claimant_avar_desc:0 "This dynasty claims to have descended from the Sassanids."

 caucasianroa.014.t:0 "The [founder.GetTitleAsNameNoTooltip] of [GetTitleByKey('k_georgia').GetNameNoTierNoTooltip]"
 caucasianroa.014.desc:0 "Since the abolition of the old kingdom of Iberia under the Sassanids, the region of Sakartvelo has been split between squabbling local lords and used as pawns in the power struggles of Persia, Arabia and Rome, but by my hand those days are done.\nToday, we arise as a restored and unified Kartveli kingdom!"

 caucasianroa.015.t:0 "$caucasianroa.014.t$"
 caucasianroa.015.desc:0 "The long-fragmented lands of Georgia are now unified, according to news brought to me by my heralds. They are now ruled by their [founder.GetTitleAsNameNoTooltip], [founder.GetShortUIName] with the support of local lords and the people."

 caucasianroa.016.t:0 "The [founder.GetTitleAsNameNoTooltip] of [GetTitleByKey('k_armenian_principality').GetNameNoTierNoTooltip]"
 caucasianroa.016.desc:0 "The tenuous grip of the [GetTitleByKey('k_armenian_principality').GetName] has been a thorn in the side of those seeking to bring the region to heel, but I and I alone have been able to coalesce the loose control over the realm and transform it into an independent and fully established kingdom!"
 caucasianroa.016.a:0 "Hail, [founder.GetNameNoTooltip], Prince of Princes!"

 caucasianroa.019.t:0 "The [founder.GetTitleAsNameNoTooltip] of [GetTitleByKey('k_armenian_cilicia').GetNameNoTierNoTooltip]"
 caucasianroa.019.desc:0 "With the chaos and strife afflicting Hayastan, many Armenians have fled to Kilikya, making a sort of \"Lesser Armenia\" around the communities that have sprung up. Now, with me holding the reins, the [GetTitleByKey('k_armenian_cilicia').GetNameNoTooltip] is united into a single realm under my control."
 caucasianroa.019.a:0 "Hail [founder.GetTitleAsNameNoTooltip] [founder.GetFirstNameNoTooltip] of [GetTitleByKey('k_armenian_cilicia').GetNameNoTierNoTooltip]!"
 caucasianroa.020.t:0 "$caucasianroa.019.t$"
 caucasianroa.020.desc:0 "The territories in and around Kilikya have been home to an Armenian diaspora for some time, but now, they have been unified under [founder.GetName], who has declared [founder.GetHerselfHimself] the new [founder.GetTitleAsNameNoTooltip] of [GetTitleByKey('k_armenian_cilicia').GetNameNoTierNoTooltip]."

 caucasianroa.021.t:0 "[defender.GetShortUINameNoTooltipNoFormat] Calls For Aid!"
 caucasianroa.021.desc:0 "[defender.GetShortUINameNoTooltipNoFormat] has been attacked by the foreign [attacker.GetShortUINameNoTooltipNoFormat], and has put out a call for aid from [defender.GetHerHis] neighbors. As good [invitee.GetCulture.GetCollectiveNounNoTooltip] we must come to their defense!"
 caucasianroa.021.a:0 "To War!"
 caucasianroa.021.b:0 "Hmm... but what have they done for us #italic lately? #!"

 caucasianroa.022.t:0 "The [founder.GetTitleAsNameNoTooltip] of [GetTitleByKey('k_aluank').GetNameNoTierNoTooltip]"
 caucasianroa.022.desc:0 "The Aghvan peoples have long lived under the rule of foreign kings, whether they were Roman, Persian or Armenian, but we are certainly not Armenian, and it's high time we had our own kingdom again. Today, I am crowned as the [founder.GetTitleAsNameNoTooltip] of [GetTitleByKey('k_aluank').GetNameNoTierNoTooltip], and of the Aghvans!"
 caucasianroa.022.a:0 "Hail [founder.GetTitleAsNameNoTooltip] [founder.GetFirstNameNoTooltip] of [GetTitleByKey('k_aluank').GetNameNoTierNoTooltip]!"
 caucasianroa.023.t:0 "$caucasianroa.022.t$"
 caucasianroa.023.desc:0 "The Aghvan peoples of [GetGeographicalRegion('custom_caucasian_albania')], long disunited and ruled by foreign powers, have been unified by [founder.GetName] under the crown of [GetTitleByKey('k_aluank').GetNameNoTierNo].\n\nThis may have repercussions on the political situation in the region."
 caucasianroa.024.t:0 "The Circassian Church's Position"
 caucasianroa.024.desc.opening:0 "The time has come for us $circassian_christianity_adherent_plural$ to reassess our position in relation to the wider world of Christendom and the ever-growing divide between Rome, Constantinople, and the Caucasus.\n\n"
 caucasianroa.024.desc.orthodox:0 "I have decided to bring our church closer to the $orthodox_religious_head$ in Constantinople."
 caucasianroa.024.desc.catholic:0 "I have decided to bring our church into communion with the $christianity_religious_head_title_name$ in Rome."
 caucasianroa.024.desc.georgian_orthodox:0 "I have chosen to align ourselves with the growing power of the $d_georgian_patriarchate$."
 caucasianroa.024.desc.armenian_apostolic:0 "I've chosen to ally ourselves with the resurgent $d_apostolic_church$."
 caucasianroa.024.desc.independent:0 "None of the other churches have the interests of faithful $circassian_christianity_adherent_plural$ in mind. I have chosen to establish an independent $d_circassian_patriarchate$!"
 caucasianroa.024.accept:0 "Time will tell if this was the right decision..."

 caucasianroa.025.desc.opening:0 "New arrives from [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! After conferring with [ROOT.Char.GetHerHis] $christianity_bishop_plural$, [ROOT.Char.GetNameNoTooltip] has declared a new ecumenical position for the Circassian church!\n\n"
 caucasianroa.025.desc.orthodox:0 "$circassian_christianity_adherent_plural$ are now in communion with the $orthodox_adj$ church."
 caucasianroa.025.desc.iconoclast:0 "$circassian_christianity_adherent_plural$ are now in communion with the $iconoclast_adj$ church."
 caucasianroa.025.desc.catholic:0 "$circassian_christianity_adherent_plural$ are now in communion with the $catholic_adj$ church."
 caucasianroa.025.desc.georgian_orthodox:0 "$circassian_christianity_adherent_plural$ are now in communion with the $georgian_orthodox_adj$ church."
 caucasianroa.025.desc.armenian_apostolic:0 "$circassian_christianity_adherent_plural$ are now in communion with the $armenian_apostolic_adj$ church."
 caucasianroa.025.desc.independent:0 "$circassian_christianity_adherent_plural$ answer to no foreign church, instead having their own independent $d_circassian_patriarchate$."

 caucasianroa.026.t:0 "Dreams of Arranshahs"
 caucasianroa.026.desc:0 "Hail, [ROOT.Char.GetFirstNameNoTooltip|U], son of [ROOT.Char.GetFather.GetFirstNameNoTooltip], prince of Arran!\n\nWith Your Father's passing, the weight of the crown falls on You - and so do all responsibilities. Our lands are still recovering from al-Turki's campaign - an opportunity many might seek to use. To the South, Caliph and his servants in Tabriz, are occupied with internal conflicts - but once those subside, their eyes might fall on us once again. To the East, Shirvan, its rulers greedily eyeing our borders and the grand city of Ganja. To the North, Sarir, its people untamed but not without reason, for they too follow teachings of Christ - even if in name only. To the West, Bagratunis led by Ashot, now titled Prince of Princes, without doubt looking to free Himself of Caliph's chains and bring forth a new era - Hayastan united under His rule.\n\nYour sons, even though young, already fight between each other. Your enemies observe your every move. Do not falter though, Son of Arran, for Lady Luck favours the bold - perhaps there still is hope to secure a grand future..."
 caucasianroa.026.accept:0 "Glory awaits!"

 baghuashi_exiled_effect:0 "Baghuashi Exiled"
 caucasianroa.029.t:0 "Fate of Baghuashi - The Exile"
 caucasianroa.029.desc:0 "As of late one of Your vassals, [sea_baghuashi_1.Char.GetNameNoTierNoTooltip], has been causing You quite some trouble - [Glossary( 'perhaps this could be a chance to settle this issue...', 'BAGHUASHI_GLOSS' )]"
 caucasianroa.029.a:0 "He shall not remain in my realm a day longer!"
 caucasianroa.029.b:0 "We should not be hasty - perhaps there is a different solution..."
 BAGHUASHI_GLOSS:0 "Liparit Baghuashi was historically exiled from his homeland of Argveti by Abkhaz monarchs in 870s. He was later invited by Bagrat I of Iberia to govern region of Trialeti, replacing Bagrat's brother, Guram."

 baghuashi_in_kidekari_effect:0 "Baghuashi in Kidekari"
 caucasianroa.030.t:0 "Fate of Baghuashi - The Arrival"
 caucasianroa.030.desc:0 "[sea_baghuashi_1.Char.GetNameNoTierNoTooltip] has finally arrived to Your court. Recently exiled from his homeland of Argveti, a nobleman in search of new land might prove a useful ally - perhaps even replace more unruly vassal, one with claims to Your titles..."
 caucasianroa.030.a:0 "[sea_baghuashi_1.Char.GetNameNoTierNoTooltip] might prove a loyal governor of Trialeti"
 caucasianroa.030.b:0 "[160032.Char.GetNameNoTierNoTooltip] shall remain in his position."

 caucasianroa.31.t:0 "The Annexation of [title.GetNameNoTierNoTooltip]"
 caucasianroa.31.desc:0 "While $k_georgia$ has long been unified, the prolonged independence of [title.GetNameNoTierNoTooltip] has been apain point, a glaring reminder that it's not #italic truly #! unified. I, however, have managed to fix that problem. With my crowning as [title.GetTierBaseTitleMale] of [title.GetNameNoTier], I have the opportunity to permanently unite this realm with that of $k_georgia$."
 caucasianroa.31.accept:0 "[title.GetNameNoTierNoTooltip] is $k_georgia_adj$!"
 caucasianroa.31.decline:0 "No, it'd only lessen my kingdom."

 restore_ani_cathedral_effect:0 "Restoration of Ani Cathedral"
 caucasianroa.032.t:0 "Restoration of Ani Cathedral"
 caucasianroa.032.desc:0 "City of Ani has been retaken from Muslim invaders! As part of the restoration, its Cathderal has been restored to its former glory - with the cross once again standing atop its dome."
 caucasianroa.032.a:0 "Praise The Lord!"

 caucasianroa.033.t:0 "Vainakh Tower Construction"
 caucasianroa.033.desc:0 "Since days of old, our people built and maintained grand stone towers, each serving variety of important roles - from a guard post to a sacred place of worship. The time has come for us to build such towers in our realm!"
 caucasianroa.033.a:0 "Have them reach the skies!"
 caucasianroa.033.b:0 "Perhaps not..."

 caucasianroa.034.t:0 "$caucasianroa.033.t$: Location"
 caucasianroa.034.desc:0 "Now it is time to choose the right place for the tower..."
 caucasianroa.034.a:0 "[location_a.GetNameNoTierNoTooltip|U] would be a good spot."
 caucasianroa.034.b:0 "[location_b.GetNameNoTierNoTooltip|U] should work."
 caucasianroa.034.c:0 "[location_c.GetNameNoTierNoTooltip|U] makes a solid choice."

 ROAintro.001.t:0 "Intro: Circassia"
 ROAintro.001_desc:0 "Thank you for playing with Rajas of Asia! RoA overhauls the Caucasus entirely.\n\nYou have chosen to play as a Circassian, a people forged by the rugged peaks and verdant valleys of the North Caucasus. For centuries, the Circassians have thrived as a fiercely independent and valorous people, bound by their unwavering adherence to the [Glossary( 'Xabze', 'XABZE_GLOSS' )], the ancient code of honor and law that governs their lives.\n\nCircassia is a realm of endless mountains, shadowed forests, and deep river valleys, a land as harsh as it is beautiful. For generations, these natural defenses have shielded the Circassians against relentless invaders: Cimmerians, Scythians, Greeks, Alans, Huns, Göktürks, Avars, Khazars, and many more have marched upon this land, seeking to claim it for their own. Each time, the Circassians resisted, refusing to bow to any conqueror.\n\nUnlike their Abkhazian cousins, Circassians do not have central leadership. For as long as anyone can remember, there has been a Grand Prince of Circassia, a title bestowed upon the most respected and powerful leader, often from the Principality of [GetTitleByKey('d_zichia').GetNameNoTier]. In name, this grand prince is the ruler of all Circassians, the king of kings among the clans. In reality, it is but a hollow formality, rarely taken seriously by the fiercely independent princes. Should you ask a Circassian prince, "To which kingdom do you belong?" he would likely laugh, look around, and answer, "Why, mine, of course!" Press further, asking who reigns above him, and he would simply reply, "#italic God and no one else!#!"\n\nNow, you step into this land of splintered clans and untamed kings. Will you forge unity from discord, or will you embrace the fierce independence that defines these people? The future of Circassia rests in your hands."
 ROAintro.001.a:0 "[Glossary( 'Hey Marje!', 'MARJE_GLOSS' )]"

 MARJE_GLOSS: "#bold "Hey Marje"#! is a common Circassian cry roughly translating to "For victory!" or "Godspeed". The term Marje is thought to be a Latin loanword, thus comparable to the English "march forward"."

 ROAintro.002.t:0 "Intro: Dzurdzuketi"
 ROAintro.002_desc:0 "Thank you for playing with Rajas of Asia! RoA overhauls the Caucasus entirely.\n\nYou have chosen to play as a Durdzuk. Durdzuks are the ancestors of the Chechen and Ingush peoples, who dwell in the rugged heart of the North Caucasus. Their land, known to medieval chroniclers as Dzurdzuketi, is a realm of towering mountains, dense forests, and swift, untamed rivers. This wild and unforgiving landscape shapes the Durdzuks, fostering a people as resilient and unyielding as the peaks they call home.\n\nFor as long as memory stretches, invaders have tested the Durdzuks’ resolve—Scythians, Alans, Khazars, and countless others have sought to subjugate their land. Yet the Durdzuks endure, holding fast to their ancestral villages and fortified mountain strongholds. Holding tightly to their [Glossary( 'Nokhchalla', 'ADAT_GLOSS' )], their motto is simple and fierce: "We are wolves to our enemies, but brothers to those we trust."\n\nThe Durdzuks’ society revolves around the clan (teip), an extended family that forms the foundation of their identity and governance. Each teip is fiercely autonomous, and while they may unite against common threats, no single ruler commands the entirety of the Durdzuks: though there is an elected leader, most Durdzuks would answer to no one but their own elders and God above."
 ROAintro.002.a:0 "Let's go."

 ROAintro.003.t:0 "Intro: Alania"
 ROAintro.003_desc:0 "Thank you for playing with Rajas of Asia! RoA overhauls the Caucasus entirely.\n\nYou have chosen to play as an Alan. Alans are a proud and ancient people who trace their lineage to the mighty Sarmatian horsemen of the steppe. The Alans, an ancient Iranic people, left their mark across the world, from the vast steppes of Central Asia to the distant shores of Africa. While many Alan tribes were assimilated, exiled, or defeated, their resilience allowed them to endure in the Caucasus, where they adapted to the local cultures and thrived for centuries.\n\nNow, their homeland lies in the fertile plains and rugged highlands of the central North Caucasus, a crossroads of civilizations where empires meet and clash. This land, known as Alania, is as much a prize as it is a battleground, and the Alans stand as its steadfast guardians. Their strength lies in their mastery of the horse and bow, their skill in trade, and their resilience in the face of adversity. They are warriors and herders, merchants and diplomats, capable of defending their freedom and thriving amid turmoil.\n\nThe Alans are a people of tradition and adaptability. Now, as their leader, you must decide their fate."
 ROAintro.003.a:0 "Let's go."

 ROAintro.004.t:0 "Intro: Abkhazia"
 ROAintro.004_desc:0 "Thank you for playing with Rajas of Asia! RoA overhauls the Caucasus entirely.\n\nYou have chosen to play as an Abkhazian. The land of Abkhazia lies between the mountains and the sea, where the waves of the Black Sea crash against the rugged coast and the deep forests of the Caucasus conceal ancient ways. The Abkhaz people, fierce warriors and shrewd rulers, have long inhabited these lands, navigating the shifting tides of power that sweep across the region.\n\nOnce a mighty kingdom, Abkhazia has seen its rulers crowned as kings and, at times, vassals to greater powers. The influence of Georgia to the east has grown strong, and many among the Abkhaz nobility have adopted Georgian ways - speaking its tongue, following its customs, and swearing loyalty to its kings. Yet in the mountain valleys and hidden hamlets, the old ways endure. Here, the Abkhaz tongue is spoken without foreign influence, the traditions of their ancestors are upheld, and in some remote places, even the ancient gods are still honored in secret.\n\nBound by [Glossary( 'Akabza', 'XABZE_GLOSS' )], the unwritten code of honor and conduct, the Abkhaz uphold values of hospitality, bravery, and loyalty. These customs, passed down through generations, shape their society just as much as any king or noble decree. Though entwined with their neighbors, the Abkhazians share deep kinship with the Circassians to the north, their distant cousins who dwell in the highlands and along the shores of the Black Sea.\n\nThe fate of Abkhazia is uncertain. Will its people remain distinct, carving their own path between the empires that rise and fall around them? Or will the pull of greater kingdoms draw them ever deeper into their orbit, changing them forever? That choice is now yours to make."
 ROAintro.004.a:0 "Let's go."

 # Events
 caucasianroa.035.t: "Xı Xhunchako Raid: Preparations"
 caucasianroa.035.d: "Sailors from many villages and clans have gathered in my hall. A veteran among them has been chosen as the thamade of the ship, which means he will act as their captain. The warriors gathered in the presence of the few [ROOT.Char.GetFaith.PriestNeuterPlural] that had supported the raid, and swore oaths upon [ROOT.Char.GetFaith.ReligiousText] to obey their captain and be fair in sharing the spoils. The men are treated as honored guests, and a feast is held in their name. As the [Glossary( 'Xabze', 'XABZE_GLOSS' )] custom dictates, I cast a sheep’s bone by the hearth, and its fall will decide whether the raid will succeed or not.\n\nThe bone lands downwards, which means [ROOT.Char.GetFaith.HighGodName] has blessed this raid!"
 caucasianroa.035.a: "The universe has spoken. Set sail immediately!"

 caucasianroa.038.t: "Xı Xhunchako Raid: Preparations"
 caucasianroa.038.d: "Sailors from many villages and clans have gathered in my hall. A veteran among them has been chosen as the thamade of the ship, which means he will act as their captain. The warriors gathered in the presence of the few [ROOT.Char.GetFaith.PriestNeuterPlural] that had supported the raid, and swore oaths upon [ROOT.Char.GetFaith.ReligiousText] to obey their captain and be fair in sharing the spoils. The men are treated as honored guests, and a feast is held in their name. As the [Glossary( 'Xabze', 'XABZE_GLOSS' )] custom dictates, I cast a sheep’s bone by the hearth, and its fall will decide whether the raid will succeed or not.\n\nThe bone lands smooth surface upwards, which means [ROOT.Char.GetFaith.HighGodName] does #bold not#! approve of this raid..."
 caucasianroa.038.a: "No, no! You saw it wrong! Set sail now!"
 caucasianroa.038.b: "There will be a raid, but not today. Postphone it for a few weeks."
 
 caucasianroa.036.t: "Xı Xhunchako Raid: Success!"
 caucasianroa.036.d: "Weeks after their departure, a ship flying our [Glossary( 'tamga', 'TAMGA_GLOSS' )] is sighted on the horizon. The captain and his crew return to our port as heroes. They speak of a swift raid on a trade ship belonging to [raid_victim_circassian.GetName], who is furious, but doesn't know it was me who sponsored the raid. The ship's hold was filled with fine silks, wines, and chests of silver coin meant for some distant port.\n\nAs is custom, the spoils are laid out in the square for all to see. The captain takes his share, the crew their portions, and a significant tribute is presented to me, their sponsor. It is a good day, though the local [ROOT.Char.GetFaith.PriestNeuterPlural] mutter darkly about the cost to our souls and the anger of [ROOT.Char.GetFaith.HighGodName]."
 caucasianroa.036.a: "They call piracy, but we call it business."

 caucasianroa.039.t:0 "Xı Xhunchako Raid: Success!"
 caucasianroa.039.d:0 "Weeks after their departure, a ship flying our [Glossary( 'tamga', 'TAMGA_GLOSS' )] is sighted on the horizon. They return with bundles of goods, foreign coin and strange trinkets. They tell of a shore-town in [raid_victim_circassian.GetName]'s realm caught unawares, its granaries looted, merchant ships stripped. Unfortunately, there were casualties; brave men did not come home, and the captain himself lost a handful of lads from his clan. Still, the raid was a success.\n\nAs is custom, the spoils are laid out in the square for all to see. The captain takes his share, the crew their portions, and a significant tribute is presented to me, their sponsor. [raid_victim_circassian.GetName] must be furious, but doesn't know it was me who sponsored this raid.\n\nNot all greet this news with joy. The [ROOT.Char.GetFaith.PriestNeuterPlural] call this theft, and some of the pious say we have turned to sin for gold."
 caucasianroa.039.a: "They call piracy, but we call it business."

 caucasianroa.037.t:0 "Xı Xhunchako Raid: Failure!"
 caucasianroa.037.d:0 "Weeks pass with no ship on the horizon. Some say a sudden storm took them; others claim they were met and routed by a better-armed ship. A few whisper something worse, that they betrayed me. Whatever the truth, the men did not come home and the promised spoils never arrived."
 caucasianroa.037.a:0 "We will hold a funeral in absentia."

 caucasianroa.040.t:0 "Xı Xhunchako Raid: Failure!"
 caucasianroa.040.d:0 "The raid was a disaster before it even began. In classic Caucasian fashion, a quarrel broke out among the crew during the feast over the division of spoils that did not yet exist.\n\nIt escalated quickly from insults to blades, leaving two men dead and the chosen thamade wounded. Several blood feuds were declared before anyone could even intervene, and the angry men stormed off to their villages.\n\nThe very few [ROOT.Char.GetFaith.PriestNeuterPlural], who had reluctantly approved of the raid, now declare the entire endeavour cursed by [ROOT.Char.GetFaith.HighGodName]."
 caucasianroa.040.a:0 "No!"

 caucasianroa.042.t:0 "Circassian Pirates!"
 caucasianroa.042.d:0 "I have received unsettling news from one of my towns. Pirates shouting in a strange tongue appeared in the harbor, launching a sudden and brutal raid.\n\nThey were laughing and singing, perhaps drunk, as they initiated their raid: storming the markets and looting the port. They were very swift and avoided most of our defenses. After some looting, their leader barked orders of retreat as he subdued one of our guards. After a brief clash with our garrison, they managed to quickly load their ships with loot and sailed away, singing and dancing. It seems that even these vile raiders feared [ROOT.Char.GetFaith.HighGodName]'s wrath, as they left our [ROOT.Char.GetFaith.HouseOfWorshipPlural] untouched and spared the lives of those who fled there."
 caucasianroa.042.a:0 "Cursed Circassian pirates!"

 caucasianroa.043.t:0 "A Question of Allegiance"
 caucasianroa.043.d:0 "The recent victories of the Georgian crown have not gone unnoticed in our lands, as well as the silence from Constantinople. A faction of our $christianity_bishop_plural$ argue forcefully that our future lies not with a distant empire, but with the powerful Georgian kingdom at our doorstep. They urge us to place our churches under the authority of the Catholicos-Patriarch of Georgia. This would certainly be a strategic move. If it proves to be a problem, we can always switch our loyalties again...\n\nThe final decision rests with me."
 caucasianroa.043.a:0 "We should align with the Georgian church."
 caucasianroa.043.b:0 "No, we should stay loyal to Constantinople."

 caucasianroa.044.t:0 "The Answer"
 caucasianroa.044.d:0 "The formalities are complete. Georgian priests have arrived in the capital, offering their services. $circassian_christianity_adherent_plural$ are now in communion with the $georgian_orthodox_adj$ church."
 caucasianroa.044.a:0 "I hope this was a good decision."

 caucasianroa.045.t:0 "Circassian Church"
 caucasianroa.045.desc.opening:0 "News arrives from [GetTitleByKey('d_zichia').GetNameNoTier]! After conferring with elders and $christianity_bishop_plural$, their leader has decided to recognize the authority of [georgian_patriarch.GetName]! $circassian_christianity_adherent_plural$ are now in communion with the $georgian_orthodox_adj$ church.\n\nInteresting. "
 caucasianroa.045.desc.georgian:0 "A welcome decision, for sure!"
 caucasianroa.045.desc.circassian:0 "A strategic decision, I suppose. We'll have to follow suit."
 caucasianroa.045.desc.greek:0 "Who gave them this authority? Do they think the church is a joke?"
 caucasianroa.045.a:0 "Okay."



