#######################################
  COURT_POSITION_CATEGORY_CHINESE_NAME: "Imperial Secretariat"

  director_of_the_left_court_position: "Director of the Left"
  director_of_the_left_court_position_desc: "The $director_of_the_left_court_position$ is the senior vice director of the Imperial Secretariat, in charge of aiding the chief ministers in policy implementation, personnel management, and other administrative matters."
  director_of_the_left_aptitude_tooltip: "[candidate.GetHerHisMy|U] [aptitude|E] is [candidate.GetCourtPositionAptitude( GetCourtPositionType( 'director_of_the_left_court_position' ) )]"
  director_of_the_left_old_holder_aptitude_tooltip: "[candidate.GetHerHisMy|U] [aptitude|E] is [candidate.GetCourtPositionAptitude( GetCourtPositionType( 'director_of_the_left_court_position' ) )] #weak ([old_holder.GetFirstName] [old_holder.GetCourtPositionAptitude( GetCourtPositionType( 'director_of_the_left_court_position' ) )])#!"
  director_of_the_left_salary_tooltip: "[GetCourtPositionType( 'director_of_the_left_court_position' ).GetName()] has a monthly salary of [gold_i][SCOPE.ScriptValue('medium_court_position_salary')|2]"

  director_of_the_right_court_position: "Director of the Right"
  director_of_the_right_court_position_desc: "The $director_of_the_right_court_position$ is the junior vice director of the Imperial Secretariat, in charge of aiding the chief ministers in policy implementation, personnel management, and other administrative matters."
